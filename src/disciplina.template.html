<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <script>
    // aplica o tema salvo antes do primeiro paint (evita flash de tema errado)
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ROOT}}style.css" />
  <script src="{{ROOT}}theme.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <a class="back" href="{{ROOT}}">← disciplinas</a>
        <h1>{{DISCIPLINA}}</h1>
        <p class="subtitle">{{UNIVERSIDADE}}</p>
      </div>
      <button id="theme-toggle" type="button" aria-label="Alternar tema claro e escuro">◐ claro</button>
    </header>

    <table class="board board-slides">
      <caption class="meta">{{META}}</caption>
      <thead>
        <tr>
          <th scope="col" class="date">Data</th>
          <th scope="col" class="name">Título</th>
          <th scope="col" class="actions">Ações</th>
        </tr>
      </thead>
      <tbody>
{{ROWS}}
      </tbody>
    </table>

    <footer>
      <span>prof. victor brayner · 2026</span>
      <a href="https://brayner.dev">brayner.dev</a>
    </footer>
  </div>
</body>
</html>
