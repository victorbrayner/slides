<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — Materiais de Aula</title>
  <meta name="description" content="Página não encontrada nos materiais de aula do Prof. Victor Brayner." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <script>
    // aplica o tema salvo antes do primeiro paint (evita flash de tema errado)
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js" defer></script>
  <style>
    /* o 404 é servido em qualquer caminho: assets em URL absoluta;
       aqui só o centralizador vertical, o resto vem do style.css */
    body {
      display: flex;
      align-items: center;
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
    }

    main {
      max-width: 560px;
    }

    main p {
      margin-bottom: 11px;
    }
  </style>
</head>
<body>
  <a class="skip" href="#conteudo">pular para o conteúdo</a>
  <div class="wrap">
    <header>
      <div>
        <h1>Erro 404</h1>
        <p class="subtitle">página não encontrada</p>
      </div>
      <button id="theme-toggle" type="button" aria-label="Alternar para o tema claro">◐ claro</button>
    </header>

    <main id="conteudo">
      <p class="comment">// o link pode estar desatualizado ou o material foi removido.</p>
      <p><a class="back" href="/">← voltar para os materiais de aula</a></p>
    </main>

    <footer>
      <span>victor brayner · 2026</span>
      <nav class="links" aria-label="Links externos">
        <a href="https://github.com/victorbrayner/slides">github</a>
        <a href="https://brayner.dev">brayner.dev</a>
      </nav>
    </footer>
  </div>
</body>
</html>
