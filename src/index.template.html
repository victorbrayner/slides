<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}" />
  <link rel="canonical" href="{{URL}}" />
  <meta property="og:site_name" content="Materiais de Aula" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESC}}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{URL}}" />
  <meta property="og:image" content="{{OGIMAGE}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Materiais de Aula do Prof. Victor Brayner" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="{{ROOT}}assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="{{ROOT}}assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#222222" />
  <script>
    // aplica o tema salvo antes do primeiro paint (evita flash de tema errado)
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="{{ROOT}}assets/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="{{ROOT}}style.css" />
  <script src="{{ROOT}}theme.js" defer></script>
  <script src="{{ROOT}}filter.js" defer></script>
</head>
<body>
  <a class="skip" href="#conteudo">pular para o conteúdo</a>
  <div class="wrap">
    <header>
      <div>
        <h1>Materiais de Aula</h1>
        <p class="subtitle">Prof. Victor Brayner</p>
      </div>
      <button id="theme-toggle" type="button" aria-label="Alternar para o tema claro">◐ claro</button>
    </header>

    <main id="conteudo">
      <div class="filtro" hidden>
        <label for="filtro" class="visually-hidden">filtrar</label>
        <input id="filtro" type="search" autocomplete="off" placeholder="digite para filtrar…" />
      </div>
      <table class="board board-index">
        <caption class="meta">{{META}}</caption>
        <thead>
          <tr>
            <th scope="col" class="name">Disciplina</th>
            <th scope="col" class="uni">Universidade</th>
            <th scope="col" class="sem">Sem.</th>
            <th scope="col" class="count">Slides</th>
            <th scope="col" class="date">Último</th>
          </tr>
        </thead>
        <tbody>
{{ROWS}}
        </tbody>
      </table>
{{EMPTY}}
      <p class="comment" id="filtro-status" role="status" hidden></p>
    </main>

    <footer>
      <span>victor brayner · {{YEAR}}</span>
      <nav class="links" aria-label="Links externos">
        <a href="https://github.com/victorbrayner/slides">github</a>
        <a href="https://brayner.dev">brayner.dev</a>
      </nav>
    </footer>
  </div>
</body>
</html>
