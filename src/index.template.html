<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="{{ROOT}}style.css" />
  <script src="{{ROOT}}theme.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Materiais de Aula</h1>
        <p class="subtitle">Prof. Victor Brayner</p>
      </div>
      <button id="theme-toggle" type="button">◐ claro</button>
    </header>

    <p class="meta">{{META}}</p>

    <ul class="board" aria-label="Disciplinas">
      <li class="head" aria-hidden="true">
        <span class="cell board-link"></span>
        <span class="cell name">Disciplina</span>
        <span class="cell uni">Universidade</span>
        <span class="cell sem">Sem.</span>
        <span class="cell count">Slides</span>
        <span class="cell date">Último</span>
      </li>
{{ROWS}}
    </ul>

    <footer>
      <span>prof. victor brayner · 2026</span>
      <a href="https://brayner.dev">brayner.dev</a>
    </footer>
  </div>
</body>
</html>
